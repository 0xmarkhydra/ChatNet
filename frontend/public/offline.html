<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#191c17" />
    <title>ChatNet • Offline</title>
    <style>
      :root { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #172238; background: #f4f7fc; }
      * { box-sizing: border-box; }
      body { min-height: 100dvh; margin: 0; display: grid; place-items: center; padding: 24px; }
      main { width: min(100%, 420px); padding: 28px 22px; text-align: center; background: white; border: 1px solid #e2e8f1; border-radius: 24px; box-shadow: 0 20px 55px rgba(31,52,87,.12); }
      img { width: 72px; height: 72px; }
      h1 { margin: 14px 0 8px; font-size: 24px; }
      p { margin: 0 0 18px; color: #6e7b91; line-height: 1.55; }
      button { min-height: 46px; border: 0; border-radius: 6px; padding: 0 18px; background: #76b900; color: #172100; font: inherit; font-weight: 800; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>ChatNet đang offline</h1>
      <p>Kiểm tra kết nối mạng rồi thử lại. Tin nhắn và dữ liệu mới luôn được lấy từ server khi online.</p>
      <button onclick="location.reload()">Thử lại</button>
    </main>
  </body>
</html>
