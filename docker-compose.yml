services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chatnet
      POSTGRES_USER: chatnet
      # Use URL-safe hex; the same value is embedded in DATABASE_URL.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatnet -d chatnet"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      PORT: "8080"
      CHATNET_ENV: ${CHATNET_ENV:-production}
      DATABASE_URL: postgres://chatnet:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/chatnet?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      OTP_PEPPER: ${OTP_PEPPER:?OTP_PEPPER must be set}
      # Keep these entries when adding CIDRs for an upstream ingress proxy.
      CHATNET_TRUSTED_PROXY_CIDRS: "${CHATNET_TRUSTED_PROXY_CIDRS:-127.0.0.1/32,172.29.0.10/32}"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_API_BASE_URL: ${RESEND_API_BASE_URL:-https://api.resend.com}
      CHATNET_EMAIL_FROM: ${CHATNET_EMAIL_FROM:-}
      AI_PROVIDER: ${AI_PROVIDER:-partner}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_STYLE: ${AI_API_STYLE:-auto}
      AI_AUTH_HEADER: ${AI_AUTH_HEADER:-Authorization}
      AI_AUTH_SCHEME: ${AI_AUTH_SCHEME:-Bearer}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      ONESIGNAL_APP_ID: ${ONESIGNAL_APP_ID:-}
      ONESIGNAL_REST_API_KEY: ${ONESIGNAL_REST_API_KEY:-}
      CHATNET_WEB_URL: ${CHATNET_WEB_URL:-https://chat.codelocal.cloud}
      MEDIA_PUBLIC_ORIGIN: ${MEDIA_PUBLIC_ORIGIN:?MEDIA_PUBLIC_ORIGIN must be set}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/ready >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        # Keep Docker preview on the same cloud account/data as chat.codelocal.cloud.
        # An empty VITE_API_URL must not silently switch to the local demo backend.
        VITE_API_URL: ${VITE_API_URL:-https://api-chat.codelocal.cloud}
        VITE_API_PROXY: "0"
    environment:
      PORT: "8080"
      BACKEND_URL: http://backend:8080
    ports:
      - "8080:8080"
    depends_on:
      - backend
    networks:
      default:
        ipv4_address: 172.29.0.10

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.29.0.0/24
