<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Demo Distributed Media Storage (POC)</title>
  <style>
    :root { --blue:#2563eb; --ink:#17233d; --muted:#697894; --line:#e8ecf7; --bg:#f5f7fd; --ok:#0cae81; --bad:#ec5271; --warn:#ff9f0e; }
    * { box-sizing: border-box; }
    body { margin:0; font:14px/1.5 Inter, system-ui, sans-serif; color:var(--ink); background:var(--bg); }
    header { background:#fff; border-bottom:1px solid var(--line); padding:12px 20px; display:flex; gap:16px; align-items:center; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
    header h1 { font-size:16px; margin:0; }
    main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:14px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:0 4px 22px rgba(38,61,120,.045); }
    .card h2 { font-size:15px; margin:0 0 4px; }
    .hint { color:var(--muted); font-size:12px; margin:0 0 10px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:10px; }
    .node { border:1px solid var(--line); border-radius:12px; padding:10px; display:grid; gap:6px; }
    .node.off { background:#fff4f6; border-color:#f8c9d2; }
    .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    button { font:inherit; border:1px solid var(--line); background:#fff; border-radius:10px; padding:6px 10px; cursor:pointer; min-height:34px; }
    button:hover { border-color:var(--blue); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
    button.primary { background:var(--blue); color:#fff; border-color:var(--blue); }
    button.danger { color:var(--bad); }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .badge { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; border:1px solid var(--line); }
    .OK,.HEALTHY,.DURABLE_VERIFIED,.ARCHIVED,.SETTLED { color:#067a5a; background:#e8f8f2; border-color:#bfeadb; }
    .CORRUPT,.MISSING,.OFFLINE,.UNAVAILABLE,.FAILED { color:#b8203c; background:#fdecef; border-color:#f8c9d2; }
    .DEGRADED,.AT_RISK,.RELAY_ACTIVE,.DISTRIBUTING,.RECONSTRUCTED { color:#9a5a00; background:#fff3df; border-color:#fbd9a0; }
    table { width:100%; border-collapse:collapse; }
    th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    th { color:var(--muted); font-weight:600; font-size:12px; }
    tr.sel { background:#eff4ff; }
    code, .mono { font-family:ui-monospace, Menlo, Consolas, monospace; font-size:12px; }
    #log { max-height:240px; overflow:auto; background:#0f172a; color:#d6e0ff; border-radius:12px; padding:10px; }
    #log div { white-space:pre-wrap; }
    .toast { padding:8px 12px; border-radius:10px; margin-top:8px; }
    .toast.err { background:#fdecef; color:#b8203c; } .toast.good { background:#e8f8f2; color:#067a5a; }
    img.preview { max-width:100%; max-height:260px; border-radius:10px; border:1px solid var(--line); }
    @media (max-width:560px){ header{position:static} }
  </style>
</head>
<body>
  <header>
    <h1>Demo: lưu media phân tán 4-of-6 &amp; "Truy cập lại" (POC giả lập, node = agent riêng)</h1>
    <label>Người dùng: <select id="user"><option>alice</option><option>bob</option><option>dave</option></select></label>
    <button id="reset" class="danger">Reset demo (phiên mới)</button>
    <span class="hint" style="margin:0">alice = người gửi, bob = thành viên nhận, dave = người ngoài nhóm</span>
  </header>
  <main id="app"><div class="card">Đang tải…</div></main>
  <script type="module" src="/web/app.ts"></script>
</body>
</html>
