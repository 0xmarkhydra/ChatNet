# Nginx 1.27 stops inheriting add_header when a location declares its own.
# Keep this include at server level and in locations that set Cache-Control.
add_header Strict-Transport-Security "max-age=86400" always;
# OneSignal page and worker load from its CDN. Browser crypto/providers use WASM.
# Inline styles support React layout and MapLibre; keep inline scripts blocked.
# HTTPS/WSS sources cover configured LiveKit, object storage and external media.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' https://cdn.onesignal.com https://api.onesignal.com/sync/; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; media-src 'self' data: blob: https:; worker-src 'self' blob:;" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy $chatnet_referrer_policy always;
add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=(self), clipboard-read=(self), clipboard-write=(self)" always;
