name: Flutter Web release checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/flutter-web-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    name: Build release and smoke-test Nginx
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image (no deployment)
        run: docker build -t chatnet-flutter-web-ci mobile
      - name: Test container routing and cache policy
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name chatnet-flutter-web-ci -e PORT=9090 -p 127.0.0.1:5189:9090 chatnet-flutter-web-ci
          trap 'docker logs chatnet-flutter-web-ci; docker rm -f chatnet-flutter-web-ci' EXIT
          base=http://127.0.0.1:5189
          curl --fail --silent --show-error --retry 15 --retry-connrefused --retry-delay 1 "$base/health" | grep -Fx OK
          curl --fail --silent --show-error "$base/" -o index.html
          grep -F 'flutter_bootstrap.js' index.html
          curl --fail --silent --show-error "$base/conversations/123" -o route.html
          cmp index.html route.html
          curl --fail --silent --show-error -I "$base/main.dart.js" | grep -i '^cache-control: no-cache'
          curl --fail --silent --show-error -I "$base/canvaskit/canvaskit.wasm" | grep -i '^content-type: application/wasm'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/missing.js")" = 404
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' "$base/assets/missing.png")" = 404
