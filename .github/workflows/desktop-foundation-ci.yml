name: SOCO Desktop core checks

on:
  push:
    branches: [feat/chatnet-desktop-electron]
  pull_request:
    branches: [feat/chatnet-desktop-electron, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop core - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Install shared frontend
        run: npm ci --prefix frontend
      - name: Install Desktop dependencies
        run: npm ci --prefix desktop
      - name: Dependency security gates
        run: |
          npm audit --prefix frontend --audit-level=high
          npm audit --prefix desktop --audit-level=high
      - name: Native vault, broker, IPC and window unit tests
        run: npm test --prefix desktop
      - name: Shared Web auth regression
        run: npm run check:session --prefix frontend
      - name: Native session adapter and persistent queue contracts
        run: npm run check:desktop-session --prefix frontend
      - name: Shared chat and outbox regression
        run: |
          npm run check:chat --prefix frontend
          npm run check:outbox --prefix frontend
      - name: Web regression build
        run: npm run build --prefix frontend
      - name: Build unsigned internal native package
        run: npm run build --prefix desktop
      - name: Actual packaged shell and OS storage smoke with isolated profile
        run: node frontend/scripts/desktop-shell-smoke.mjs
      # No unsigned installer upload, signing, publishing or release deployment.
      # This automated smoke does not replace real-account/two-device UAT.

  backend:
    name: Backend contract and disposable DB integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: socoqa
          POSTGRES_USER: socoqa
          POSTGRES_PASSWORD: local-qa-only
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U socoqa -d socoqa"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CHATNET_TEST_DATABASE_URL: postgres://socoqa:local-qa-only@127.0.0.1:5432/socoqa?sslmode=disable
      CHATNET_TEST_REDIS_ADDR: 127.0.0.1:6379
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -p 1 -count=1 -v ./...
