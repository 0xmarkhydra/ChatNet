name: Web/PWA quality gates

on:
  push:
    branches:
      - main
      - dev
      - 'feat/chatnet-*'
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck, build and browser-logic tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm run check:pwa
      - run: npm run check:incoming-sound
      - run: npm run check:onesignal
      - run: npm run check:session
      - run: npm run check:optimistic
      - run: npm run check:chat
      - run: npm run check:outbox
      - run: npm run check:call-translation
      - run: npm run check:call-live

  backend:
    name: Go API unit and integration packages
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
