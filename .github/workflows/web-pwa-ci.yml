name: Web/PWA quality gates

on:
  push:
    branches:
      - main
      - dev
      - toan-nguyen-dev
      - 'feat/chatnet-*'
  pull_request:
    branches:
      - main
      - dev
      - toan-nguyen-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pwa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Typecheck, build and browser-logic tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate Docker Compose required settings
        working-directory: ${{ github.workspace }}
        env:
          JWT_SECRET: ci-only-jwt-secret
          OTP_PEPPER: ci-only-otp-pepper
          POSTGRES_PASSWORD: 6f4a9f8c2d7b1e0a
          MEDIA_PUBLIC_ORIGIN: https://media.example.invalid
        run: |
          empty_env="$(mktemp)"
          docker compose --env-file "$empty_env" config --quiet
          for required in POSTGRES_PASSWORD JWT_SECRET OTP_PEPPER MEDIA_PUBLIC_ORIGIN; do
            if output="$(env -u "$required" docker compose --env-file "$empty_env" config --quiet 2>&1)"; then
              echo "Compose accepted missing required variable: $required"
              exit 1
            fi
            grep -F "$required must be set" <<< "$output" >/dev/null
          done
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Enforce React Hooks lint baseline
        run: npm run lint
      - name: Test architecture boundary rules
        run: node --test scripts/architecture-boundaries-selfcheck.mjs
      - name: Check feature dependency boundaries
        run: npm run check:architecture
      - name: Verify API/OpenAPI route contract
        working-directory: ${{ github.workspace }}
        run: node scripts/check-api-contract.mjs
      - name: Test baseline ratchet enforcement
        run: node --test scripts/baseline-ratchet-check.selfcheck.mjs
      - name: Reject baseline increases in pull requests
        if: github.event_name == 'pull_request'
        run: node scripts/baseline-ratchet-check.mjs "origin/${{ github.base_ref }}"
      - name: Run frontend unit and component tests
        run: npm run test:unit
      - run: npm run build
      - run: npm run check:pwa
      - run: npm run check:incoming-sound
      - run: npm run check:onesignal
      - run: npm run check:session
      - run: npm run check:optimistic
      - run: npm run check:chat
      - run: npm run check:outbox
      - run: npm run check:offline-browser
      - name: Verify responsive chat rails and route return
        run: npm run check:chat-rail-responsive
      - name: Protect approved unified Contacts and Calls layout
        run: npm run check:unified-contacts-layout
      - run: npm run check:call-translation
      - run: npm run check:call-live

  backend:
    name: Go API unit and integration packages
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: chatnet
          POSTGRES_USER: chatnet
          POSTGRES_PASSWORD: chatnet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chatnet -d chatnet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - name: Run backend integration tests against disposable PostgreSQL and Redis
        run: go test -p 1 -count=1 -v ./...
        env:
          CHATNET_TEST_DATABASE_URL: postgres://chatnet:chatnet@127.0.0.1:5432/chatnet?sslmode=disable
          CHATNET_TEST_REDIS_ADDR: 127.0.0.1:6379
      - name: Verify P0-08 media access with disposable PostgreSQL and in-memory S3
        run: go test ./cmd/chat -run '^TestP008LocalIntegration$' -count=1 -v
        env:
          CHATNET_TEST_DATABASE_URL: postgres://chatnet:chatnet@127.0.0.1:5432/chatnet?sslmode=disable
          CHATNET_P008_LOCAL_E2E: "1"
